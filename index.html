<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>bKash Cash-Out Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#171717}
main{max-width:430px;margin:auto;padding:20px 16px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0001}
h1{font-size:22px;margin:0 0 5px}.sub{color:#666;font-size:13px;margin-bottom:18px}
label{display:block;font-weight:650;font-size:13px;margin:13px 0 6px}
input{width:100%;height:50px;border:1px solid #ddd;border-radius:12px;padding:0 14px;font-size:17px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{height:48px;border:0;border-radius:12px;font-size:16px;font-weight:700}.calc{background:#111827;color:white}.reset{background:#eee}
.result{margin-top:16px;background:#f8f8fa;border-radius:14px;padding:15px}
.big{font-size:31px;font-weight:800;margin:3px 0 10px}.row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.note{font-size:12px;color:#777;line-height:1.45;margin-top:13px}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Cash-Out Calculator</h1>
<div class="sub">Maximum cash from the customer's available balance</div>
<label for="balance">Customer balance (৳)</label>
<input id="balance" type="number" inputmode="decimal" min="0" step="0.01" placeholder="10000">
<label for="rate">Charge per ৳1,000</label>
<input id="rate" type="number" inputmode="decimal" min="0" step="0.01" value="18.50">
<div class="buttons"><button class="calc" id="calculate">Calculate</button><button class="reset" id="reset">Reset</button></div>
<div class="result" aria-live="polite">
<div style="font-size:12px;color:#777">Customer receives</div>
<div class="big" id="cash">৳0.00</div>
<div class="row"><span>Cash-out charge</span><strong id="fee">৳0.00</strong></div>
<div class="row"><span>Total deducted</span><strong id="total">৳0.00</strong></div>
</div>
<div class="note">Enter the current applicable rate. This app does not verify bKash's current fee schedule.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function money(n){return "৳"+(Number.isFinite(n)?n:0).toFixed(2)}
function calculate(){
 const b=Math.max(0,Number($("balance").value)||0);
 const r=Math.max(0,Number($("rate").value)||0);
 const cash=b/(1+r/1000), fee=cash*r/1000;
 $("cash").textContent=money(cash);$("fee").textContent=money(fee);$("total").textContent=money(cash+fee);
}
$("calculate").onclick=calculate;
$("reset").onclick=()=>{$("balance").value="";$("rate").value="18.50";$("cash").textContent="৳0.00";$("fee").textContent="৳0.00";$("total").textContent="৳0.00";$("balance").focus()};
$("balance").onkeydown=e=>{if(e.key==="Enter")calculate()};
$("rate").onkeydown=e=>{if(e.key==="Enter")calculate()};
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body></html>
